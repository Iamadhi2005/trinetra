name: trinetra_flutter
description: "TRINETRA IoMT - Smart Hospital Zero-Trust IDS Mobile Console"
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  audioplayers: ^6.0.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/beep_alert.wav
    - assets/images/icon.png
    - assets/images/logo.png
    - assets/images/notification-icon.png
